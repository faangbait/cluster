---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: default
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx
  type: LoadBalancer
  # Was 10.4.99.99, outside the MetalLB pool (10.4.0.0/22 ends at 10.4.3.255),
  # so it never allocated.
  loadBalancerIP: "10.4.3.99"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-ingress
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`test.mon.madeof.glass`)
      kind: Rule
      services:
        - name: nginx
          port: http
  tls:
    certResolver: letsencrypt
