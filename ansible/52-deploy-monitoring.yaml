- name: Deploy Monitoring
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  vars:
    # node3 is the workstation, not a cluster member, so it isn't in the
    # inventory and its address lives here. Alertmanager pushes to it rather
    # than node3 polling: Alertmanager's ClusterIP isn't routable off-cluster
    # and its Ingress is behind the Authelia middleware chain.
    alert_notify_url: "http://10.0.8.252:9099/"
  tasks:
    - name: Add Prometheus Community Chart Repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        # helm 4 errors on an existing repo instead of no-opping.
        force_update: true

    - name: Add Thanos Community Chart Repo
      kubernetes.core.helm_repository:
        name: thanos-community
        repo_url: https://thanos-community.github.io/helm-charts
        force_update: true

    # ------------------------------------------------------------------
    # MinIO on glass-cfg. Thanos's compact target is S3, not a filesystem
    # on NFS — FILESYSTEM objstore has the same listing races that stalled
    # Prometheus compaction. MinIO is the S3 API in front of the replicate
    # volume. Credentials live only in the cluster; 52 generates them once
    # and never overwrites.
    # ------------------------------------------------------------------
    - name: Look up the minio secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: observability
        name: minio
      register: deploy_monitoring_minio_secret
      check_mode: false

    - name: Create the minio secret
      when: deploy_monitoring_minio_secret.resources | length == 0
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: minio
            namespace: observability
            annotations:
              a8r.io/description: "MinIO root user. Generated by 52 on first run, never overwritten."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          type: Opaque
          stringData:
            MINIO_ROOT_USER: thanos
            MINIO_ROOT_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Re-read the minio secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: observability
        name: minio
      register: deploy_monitoring_minio_secret
      check_mode: false

    - name: Derive the thanos-objstore secret from minio
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: thanos-objstore
            namespace: observability
            annotations:
              a8r.io/description: "Thanos S3 config. Derived from secret/minio. Rotate there, re-run 52."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          type: Opaque
          stringData:
            objstore.yml: |
              type: S3
              config:
                bucket: thanos
                endpoint: minio.observability.svc.cluster.local:9000
                access_key: "{{ deploy_monitoring_minio_secret.resources[0].data.MINIO_ROOT_USER | b64decode }}"
                secret_key: "{{ deploy_monitoring_minio_secret.resources[0].data.MINIO_ROOT_PASSWORD | b64decode }}"
                insecure: true
      no_log: true

    - name: Deploy minio PVC
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: minio
            namespace: observability
            annotations:
              a8r.io/description: "Thanos object store. glass-cfg, not glass-bulk — this is replicated."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          spec:
            storageClassName: glass-cfg
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: 100Gi

    - name: Deploy minio
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: observability
            labels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/part-of: observability
            annotations:
              a8r.io/description: "S3 API for Thanos. Data is on glass-cfg."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app.kubernetes.io/name: minio
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: minio
                  app.kubernetes.io/part-of: observability
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9000"
                  prometheus.io/path: /minio/v2/metrics/cluster
              spec:
                imagePullSecrets:
                  - name: regcred
                securityContext:
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                containers:
                  - name: minio
                    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
                    imagePullPolicy: IfNotPresent
                    args:
                      - server
                      - /data
                      - --console-address
                      - :9001
                    envFrom:
                      - secretRef:
                          name: minio
                    env:
                      - name: MINIO_PROMETHEUS_AUTH_TYPE
                        value: public
                    ports:
                      - name: s3
                        containerPort: 9000
                      - name: console
                        containerPort: 9001
                    volumeMounts:
                      - name: data
                        mountPath: /data
                    livenessProbe:
                      httpGet:
                        path: /minio/health/live
                        port: s3
                      initialDelaySeconds: 10
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /minio/health/ready
                        port: s3
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      requests:
                        memory: 256Mi
                        cpu: "0.1"
                      limits:
                        memory: 1Gi
                        cpu: "1"
                  # Shares the pod network, so 127.0.0.1 is the minio server.
                  # Sleeps after mb so a crash of this container doesn't
                  # restart the whole Recreate pod and drop S3.
                  - name: ensure-bucket
                    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
                    imagePullPolicy: IfNotPresent
                    envFrom:
                      - secretRef:
                          name: minio
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        i=0
                        until mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                          i=$((i+1))
                          [ "$i" -gt 60 ] && exit 1
                          sleep 2
                        done
                        mc mb --ignore-existing local/thanos
                        exec sleep infinity
                    resources:
                      requests:
                        memory: 32Mi
                        cpu: "0.01"
                      limits:
                        memory: 64Mi
                        cpu: "0.1"
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: minio

    - name: Deploy minio Service
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: observability
            labels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/part-of: observability
          spec:
            selector:
              app.kubernetes.io/name: minio
            ports:
              - name: s3
                port: 9000
                targetPort: s3

    - name: Wait for minio
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: observability
        name: minio
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    # Query + store + compact. Sidecar is on the Prometheus pod, next task.
    # Compactor data-dir is emptyDir — it downloads, merges, downsamples,
    # uploads. Durable blocks live in MinIO. Receive / Query Frontend /
    # Ruler are off: alerting stays on Prometheus.
    #
    # Pinned, same reason as kube-prometheus-stack. Image tag matches the
    # sidecar kube-prometheus-stack 88.3.0 ships (thanosImage v0.42.4).
    # Before kube-prometheus-stack so Grafana's datasource URL has a backend
    # the moment it flips from Prometheus to Query.
    - name: Deploy Thanos 0.41.0
      kubernetes.core.helm:
        name: thanos
        chart_ref: thanos-community/thanos
        chart_version: "0.41.0"
        release_namespace: observability
        values:
          global:
            image:
              registry: quay.io
              repository: thanos/thanos
              tag: v0.42.4
            imagePullSecrets:
              - name: regcred
            objstore:
              createSecret: false
              secretName: thanos-objstore
              secretKey: objstore.yml
            serviceMonitor:
              enabled: true
              interval: 30s
              labels:
                release: kube-prometheus-stack
            thanosRules:
              enabled: true
              labels:
                release: kube-prometheus-stack
              groups:
                thanosSidecar:
                  enabled: true

          bucket:
            enabled: false
          receive:
            enabled: false
          queryFrontend:
            enabled: false
          ruler:
            enabled: false

          query:
            replicaCount: 2
            endpoints:
              autogen:
                enabled: true
              static:
                - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.observability.svc.cluster.local

          storegateway:
            replicaCount: 2
            # Index cache is rebuildable from the bucket. emptyDir, not
            # glass-cfg — store mmaps the cache, which is the same class
            # of NFS bug as Prometheus TSDB.
            persistence:
              enabled: false

          compactor:
            replicaCount: 1
            persistence:
              enabled: false
            vpa:
              enabled: false
            # Compactor deletes from the bucket past these. Empty would
            # mean keep forever. Downsampling itself is the binary default.
            retention:
              resolutionRaw: 7d
              resolution5m: 30d
              resolution1h: 1y

    # Pinned to what the live release runs. Unpinned, any run of this playbook would
    # upgrade the whole monitoring stack as a side effect. Bump deliberately.
    - name: Deploy kube-prometheus-stack 88.3.0
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "88.3.0"
        release_namespace: observability
        create_namespace: true
        values:
          defaultRules:
            runbookUrl: "https://github.com/faangbait/runbooks"

          global:
            imagePullSecrets:
              - "regcred"

          # The chart assumes control-plane components listen on the node IP.
          # kubeadm binds them to 127.0.0.1 — scheduler and controller-manager
          # via --bind-address, etcd via --listen-metrics-urls — and has since
          # k8s 1.17, as CIS hardening. Left enabled, all three scrape jobs are
          # permanently down and raise TargetDown plus etcdInsufficientMembers.
          #
          # Off, not rebound. Exposing them would undo a CIS control to satisfy
          # a monitoring default, which is backwards for this cluster. The
          # apiserver's /readyz reports on all three anyway.
          #
          # The cost is real and worth naming: no scheduler queue depth, no
          # controller-manager workqueue latency, no etcd fsync/commit
          # histograms. Re-enable alongside the bind changes if that day comes.
          kubeEtcd:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeControllerManager:
            enabled: false

          # Different reason: there is no kube-proxy to scrape. 30 runs
          # `kubeadm init --skip-phases=addon/kube-proxy` and Calico handles
          # it, so this ServiceMonitor selects nothing. Silent dead config
          # rather than a firing alert, but dead either way.
          kubeProxy:
            enabled: false

          alertmanager:
            # Setting `config` replaces the chart default wholesale rather than
            # merging, so the inhibit rule and the Watchdog route have to be
            # restated here or they are silently lost.
            config:
              global:
                resolve_timeout: 5m
              inhibit_rules:
                # A critical and a warning for the same thing are one problem.
                # Without this every outage arrives as two notifications.
                - source_matchers:
                    - severity = "critical"
                  target_matchers:
                    - severity = "warning"
                  equal: ['namespace', 'alertname']
              route:
                group_by: ['alertname', 'namespace']
                group_wait: 30s
                group_interval: 5m
                # The chart default is 12h. On a desktop that reads as the
                # alert having gone away; 4h is often enough to still be nagged
                # without being wallpaper.
                repeat_interval: 4h
                receiver: 'gnome'
                routes:
                  # Watchdog fires constantly by design — it is the dead-man's
                  # switch proving the alert path works. Never notify on it.
                  - receiver: 'null'
                    matchers:
                      - alertname = "Watchdog"
                  # info is noise on a desktop notifier; only warning+ should wake it.
                  - receiver: 'null'
                    matchers:
                      - severity = "info"
                  - receiver: 'null'
                    matchers:
                      - alertname = "InfoInhibitor"
              receivers:
                - name: 'null'
                - name: 'gnome'
                  webhook_configs:
                    - url: "{{ alert_notify_url }}"
                      send_resolved: true
                      # The desktop is asleep or rebooting a lot of the time.
                      # Without this, every retry against a dead workstation
                      # spams the Alertmanager log.
                      max_alerts: 20
              templates:
                - '/etc/alertmanager/config/*.tmpl'
            ingress:
              enabled: true
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
                traefik.ingress.kubernetes.io/router.tls.domains.0.main: alerts.mon.madeof.glass
                traefik.ingress.kubernetes.io/router.middlewares: vault-chain-authelia-auth@kubernetescrd
              hosts:
                - alerts.mon.madeof.glass
            service:
              sessionAffinity: "ClientIP"
            alertmanagerSpec:
              # A single replica means the thing that tells you a node died
              # dies with it. Alertmanager gossips over the mesh on 9094 and
              # dedupes notifications between peers, so two replicas send one
              # notification, not two.
              #
              # Two, not three: with hard anti-affinity across three nodes, a
              # third replica has nowhere to go when a node is lost and sits
              # Pending. Two leaves a spare node for a graceful reschedule.
              #
              # Note what this does and does not buy. A StatefulSet pod on an
              # unreachable node stays Terminating indefinitely — the
              # guarantee of at-most-one pod per ordinal means Kubernetes will
              # not recreate it while it cannot confirm the old one is gone.
              # So a hard node failure leaves you at 1/2 until the node
              # returns or the pod is force-deleted. The win is that the
              # surviving replica keeps alerting; it is not self-healing.
              replicas: 2
              # hard, not the chart's default soft. Soft is a preference the
              # scheduler may ignore, and both replicas landing on one node is
              # exactly the failure this is meant to prevent.
              podAntiAffinity: "hard"
              podAntiAffinityTopologyKey: kubernetes.io/hostname
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: "glass-cfg"
                    accessModes: ["ReadWriteMany"]
                    resources:
                      requests:
                        storage: 10Gi
              portName: "alertman-web"

          grafana:
            ingress:
              enabled: true
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
                traefik.ingress.kubernetes.io/router.tls.domains.0.main: grafana.mon.madeof.glass
                traefik.ingress.kubernetes.io/router.middlewares: vault-chain-authelia-auth@kubernetescrd
              hosts:
                - grafana.mon.madeof.glass
            service:
              portName: grafana-web
            sidecar:
              datasources:
                # Same uid `prometheus`, so the kube-prometheus-stack
                # dashboards keep working. Query fans out to the sidecar
                # (live) and store gateway (history).
                url: http://thanos-query.observability.svc.cluster.local:9090/

          prometheus:
            thanosService:
              enabled: true
            thanosServiceMonitor:
              enabled: true
              # Without this the sidecar target inherits job=kube-prometheus-stack-thanos-discovery
              # from the Service name. Pin it so sidecar series are addressable
              # as job="thanos-sidecar" alongside the query/store/compact jobs.
              relabelings:
                - action: replace
                  targetLabel: job
                  replacement: thanos-sidecar
            ingress:
              enabled: true
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
                traefik.ingress.kubernetes.io/router.tls.domains.0.main: prom.mon.madeof.glass
                traefik.ingress.kubernetes.io/router.middlewares: vault-chain-authelia-auth@kubernetescrd
              hosts:
                - prom.mon.madeof.glass
            prometheusSpec:
              # emptyDir, not glass-cfg. Prometheus TSDB on NFS-Ganesha left
              # empty block directories that made compaction fail forever.
              # Live head is expendable (alerting lookback is 15-30 min).
              # Compacted 2h blocks upload to MinIO on glass-cfg via the
              # Thanos sidecar. 48h is long enough for that upload before
              # local deletion. retentionSize / sizeLimit still cap node disk.
              retention: 48h
              retentionSize: "8GB"
              externalLabels:
                cluster: glass
              storageSpec:
                emptyDir:
                  sizeLimit: 10Gi
              thanos:
                objectStorageConfig:
                  existingSecret:
                    name: thanos-objstore
                    key: objstore.yml
              portName: "prometheus-web"
              additionalScrapeConfigs:
                - job_name: 'kubernetes-pods'
                  kubernetes_sd_configs:
                    - role: pod
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                      action: keep
                      regex: true
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                      action: replace
                      target_label: __metrics_path__
                      regex: (.+)
                    # Single-quoted, not plain. A plain YAML scalar passes
                    # `\\d` through as an escaped backslash followed by `d`,
                    # which never matches, so the annotated port was ignored
                    # and pod SD fell back to scraping every declared
                    # containerPort — including ones serving no metrics.
                    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                      action: replace
                      regex: '([^:]+)(?::\d+)?;(\d+)'
                      replacement: $1:$2
                      target_label: __address__
                    # Was __meta_kubernetes_service_annotation_*, which pod SD
                    # never emits. Only role: service produces those.
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                      action: replace
                      target_label: __scheme__
                      regex: (https?)
                    # Without these, annotation-discovered targets carry only
                    # job and instance — no way to tell traefik from authelia
                    # in a query or an alert.
                    - source_labels: [__meta_kubernetes_namespace]
                      action: replace
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_pod_name]
                      action: replace
                      target_label: pod
                    - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                      action: replace
                      target_label: app

    # ------------------------------------------------------------------
    # gluster-metrics-exporter is a systemd service on the storage nodes,
    # not a pod, so the annotation-discovery job above can't find it. Built
    # from the inventory so no node address is hardcoded here.
    # ------------------------------------------------------------------
    - name: Build the Gluster scrape targets from the inventory
      ansible.builtin.set_fact:
        gluster_static_configs: >-
          {{ gluster_static_configs | default([]) + [{
               'targets': [hostvars[item].nmcli_ip4 | split('/') | first ~ ':9713'],
               'labels': {'node': item}
             }] }}
      loop: "{{ groups['cluster'] }}"

    - name: Deploy the gluster ScrapeConfig
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: monitoring.coreos.com/v1alpha1
        kind: ScrapeConfig
        name: gluster
        namespace: observability
        definition:
          metadata:
            # scrapeConfigSelectorNilUsesHelmValues is on (chart default) —
            # without this label Prometheus never selects it.
            labels:
              release: kube-prometheus-stack
            annotations:
              a8r.io/description: "Static scrape target for gluster-metrics-exporter on the storage nodes. Health is an enum, not a boolean: 0=not started, 1=down, 2=degraded, 3=partial, 4=up."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          spec:
            jobName: gluster
            scrapeInterval: 60s
            staticConfigs: "{{ gluster_static_configs }}"

    # ------------------------------------------------------------------
    # UniFi / UDM Pro via unpoller.
    #
    # Same secret name and same keys as the unifi-dns secret 55 asserts in the
    # external-dns namespace — it is literally the same console-scoped key.
    # Secrets don't cross namespaces, so observability needs its own copy, but
    # keeping the shape identical means it is a copy rather than a second
    # thing to rotate differently.
    # ------------------------------------------------------------------
    - name: Look up the unifi-dns secret in external-dns
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: external-dns
        name: unifi-dns
      register: deploy_monitoring_unifi_secret
      check_mode: false

    - name: Assert the unifi-dns secret exists
      ansible.builtin.assert:
        that:
          - deploy_monitoring_unifi_secret.resources | length > 0
        fail_msg: >-
          Secret unifi-dns is missing in namespace external-dns, so there is
          nothing to copy into observability. Create the external-dns one
          first — 55 asserts it too:
            . bin/unifi-env
            kubectl -n external-dns create secret generic unifi-dns \
              --from-literal=UNIFI_HOST="https://${UNIFI_HOST}" \
              --from-literal=UNIFI_API_KEY="${UNIFI_API_KEY}"
        quiet: true

    # This is a copy of a live secret, not a secret authored here. The rule
    # against ansible creating secrets exists because writing one from a
    # stored copy would silently clobber working credentials — there is no
    # stored copy in this path, external-dns is the source of truth and
    # rotating it there is enough.
    - name: Mirror unifi-dns into observability
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: v1
        kind: Secret
        name: unifi-dns
        namespace: observability
        definition:
          metadata:
            annotations:
              a8r.io/description: "Copy of external-dns/unifi-dns. Rotate there, re-run 52."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          type: "{{ deploy_monitoring_unifi_secret.resources[0].type }}"
          data: "{{ deploy_monitoring_unifi_secret.resources[0].data }}"
      no_log: true

    - name: Deploy unpoller
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: apps/v1
        kind: Deployment
        name: unpoller
        namespace: observability
        definition: |
          metadata:
            labels:
              app.kubernetes.io/name: unpoller
              app.kubernetes.io/part-of: observability
            annotations:
              a8r.io/description: "Exports UDM Pro, switch, AP and client metrics from the UniFi API."
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app.kubernetes.io/name: unpoller
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: unpoller
                  app.kubernetes.io/part-of: observability
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9130"
                  prometheus.io/path: /metrics
              spec:
                imagePullSecrets:
                  - name: regcred
                containers:
                  - name: unpoller
                    # Pinned, like every other chart and image here.
                    image: ghcr.io/unpoller/unpoller:v4.0.0
                    imagePullPolicy: IfNotPresent
                    ports:
                      - name: metrics
                        containerPort: 9130
                        protocol: TCP
                    env:
                      # Mapped by key rather than envFrom, so the secret keeps
                      # the same key names as the external-dns copy and stays a
                      # straight `kubectl apply` away from it. unpoller reads
                      # config from UP_-prefixed env; the secret does not.
                      - name: UP_UNIFI_DEFAULT_URL
                        valueFrom:
                          secretKeyRef:
                            name: unifi-dns
                            key: UNIFI_HOST
                      - name: UP_UNIFI_DEFAULT_API_KEY
                        valueFrom:
                          secretKeyRef:
                            name: unifi-dns
                            key: UNIFI_API_KEY
                      # The UDM Pro serves its console on a self-signed cert.
                      - name: UP_UNIFI_DEFAULT_VERIFY_SSL
                        value: "false"
                      - name: UP_UNIFI_DEFAULT_SITES_0
                        value: "all"
                      # No InfluxDB here; without this it retries a connection
                      # to 127.0.0.1:8086 forever and buries the real logs.
                      - name: UP_INFLUXDB_DISABLE
                        value: "true"
                      - name: UP_PROMETHEUS_HTTP_LISTEN
                        value: "0.0.0.0:9130"
                      # PII and IDS data are the high-cardinality, high-risk
                      # collectors. Off deliberately — turn them on knowingly.
                      - name: UP_UNIFI_DEFAULT_SAVE_IDS
                        value: "false"
                      - name: UP_UNIFI_DEFAULT_SAVE_DPI
                        value: "false"
                      # Per-interval logs, one line per device, are noise once
                      # this is working.
                      - name: UP_POLLER_QUIET
                        value: "true"
                    resources:
                      requests:
                        memory: 64Mi
                        cpu: ".05"
                      limits:
                        memory: 256Mi
                        cpu: ".25"
