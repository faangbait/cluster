# kubectl create -n flux-system secret generic git-token-auth --from-literal=username=XXXXX --from-literal=password=XXXXX

- name: Deploy Flux
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  tasks:
    - name: Deploy flux-operator 0.59.0
      kubernetes.core.helm:
        name: flux-operator
        chart_ref: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        release_namespace: flux-system
        create_namespace: true
        chart_version: "0.59.0"
        values:
          serviceMonitor:
            create: true
            labels:
              release: kube-prometheus-stack
    - name: Deploy FluxInstance
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: fluxcd.controlplane.io/v1
        kind: FluxInstance
        name: flux
        namespace: flux-system
        definition:
          metadata:
            annotations:
              fluxcd.controlplane.io/reconcileEvery: "1h"
              fluxcd.controlplane.io/reconcileTimeout: "10m"
          spec:
            distribution:
              version: "2.9.x"
              registry: "ghcr.io/fluxcd"
              artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
            components:
              - source-controller
              - source-watcher
              - kustomize-controller
              - helm-controller
              - notification-controller
              - image-reflector-controller
              - image-automation-controller
            cluster:
              type: kubernetes
              size: small
              multitenant: false
              networkPolicy: true
              domain: "cluster.local"
            sync:
              kind: GitRepository
              url: "https://github.com/faangbait/gitops-flux.git"
              ref: "refs/heads/main"
              path: "./"
              pullSecret: "git-token-auth"
