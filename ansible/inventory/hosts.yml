cluster:
  hosts:
    node1:
      ansible_user: ss
      nmcli_name: enp6s0f1
      nmcli_ifname: enp6s0f1
      nmcli_gw4: "10.0.0.1"
      nmcli_ip4: "10.0.8.254/20"
    node2:
      ansible_user: ss
      nmcli_name: enp3s0f1
      nmcli_ifname: enp3s0f1
      nmcli_mac: "00:90:fa:8a:03:de"
      nmcli_gw4: "10.0.0.1"
      nmcli_ip4: "10.0.8.253/20"
      # Onboard e1000e. Must stay unmanaged: the enp3s0f1 profile
      # previously drifted onto this NIC when the Emulex SFP+ was down.
      unmanaged_nics:
        - enp0s25
    node4:
      ansible_user: ss
      nmcli_name: eno1
      nmcli_ifname: eno1
      nmcli_gw4: "10.0.0.1"
      nmcli_ip4: "10.0.8.251/20"

controlplane:
  hosts:
    node1:
      ansible_user: ss
      highmem: true

workers:
  hosts:
    node2:
      ansible_user: ss
    node4:
      ansible_user: ss
      highmem: true

all:
  hosts:
    node1: {}
    node2: {}
    node4: {}
    localhost: {}
    