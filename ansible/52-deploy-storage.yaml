- name: Deploy Storage
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  tasks:
    # The two provisioners behind every PVC: glass-bulk (media, /bulk) and glass-cfg
    # (application config, /cfg, and the default StorageClass).

    - name: Add NFS Subdir External Provisioner Chart Repo
      kubernetes.core.helm_repository:
        name: nfs-subdir-external-provisioner
        repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        # helm 4 errors on an existing repo instead of no-opping.
        force_update: true

    # Pinned to what the live releases run. Unpinned, any run of this playbook would
    # silently upgrade the provisioner behind every PVC. Bump deliberately.
    - name: Deploy glass-bulk-provisioner 4.0.18
      kubernetes.core.helm:
        name: glass-bulk-provisioner
        chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
        chart_version: "4.0.18"
        release_namespace: vault
        values:
          nfs:
            server: '10.0.8.254'
            path: '/bulk'
          storageClass:
            name: glass-bulk
            provisionerName: k8s-sigs.io/glass-bulk-provisioner
            archiveOnDelete: false
            accessModes: ReadWriteMany
            pathPattern: pvc/${.PVC.namespace}/${.PVC.name}

    - name: Deploy glass-cfg-provisioner 4.0.18
      kubernetes.core.helm:
        name: glass-cfg-provisioner
        chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
        chart_version: "4.0.18"
        release_namespace: vault
        values:
          nfs:
            server: '10.0.8.254'
            path: '/cfg'
          storageClass:
            name: glass-cfg
            provisionerName: k8s-sigs.io/glass-cfg-provisioner
            defaultClass: true
            accessModes: ReadWriteMany
            pathPattern: pvc/${.PVC.namespace}/${.PVC.name}
