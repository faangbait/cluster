- name: Add Calico Chart Repo
  kubernetes.core.helm_repository:
    name: projectcalico
    repo_url: https://docs.tigera.io/calico/charts

- name: "Deploy Calico {{ calico_version }}"
  kubernetes.core.helm:
    name: calico
    chart_ref: projectcalico/tigera-operator
    release_namespace: tigera-operator
    create_namespace: true
    chart_version: "{{ calico_version }}"
    values:
      installation:
        cni:
          type: Calico
        calicoNetwork:
          kubeProxyManagement: Enabled
          linuxDataplane: BPF
          bgp: Disabled
          ipPools:
            - name: default-ipv4-ippool
              blockSize: 26
              cidr: 10.48.0.0/16
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()
          nodeAddressAutodetectionV4:
            cidrs:
              - "10.0.8.0/24"
      defaultFelixConfiguration:
        enabled: true
        bpfExternalServiceMode: Tunnel
      kubernetesServiceEndpoint:
        host: "10.0.8.254"
        port: "6443"

# Required whenever linuxDataplane: BPF is enabled - IPAM must be node-affine
# or the eBPF/DSR forwarding path can send return traffic to the wrong node,
# breaking direct node-to-node traffic (e.g. MetalLB memberlist on 7946).
# https://docs.tigera.io/calico/latest/networking/ipam/ipam#change-the-node-selector-for-an-ip-pool
- name: Enable strict affinity for Calico IPAM (required for eBPF dataplane)
  kubernetes.core.k8s:
    state: present
    api_version: projectcalico.org/v3
    kind: IPAMConfiguration
    name: default
    definition:
      spec:
        strictAffinity: true
