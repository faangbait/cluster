- name: Configure Intranet
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      10.0.8.254 node1 tengig1 k8s-control-plane-lb
      10.0.8.253 node2 tengig2
      10.0.8.252 node3 tengig3
      10.0.8.251 node4 tengig4
    backup: true

- name: Configure modprobe
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Sysctl (bridge)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-ip6tables

- name: Configure Sysctl (somaxconn)
  ansible.posix.sysctl:
    name: "net.core.somaxconn"
    value: '10000'
    sysctl_set: true

- name: NIC wedge watchdog
  when:
    - nic_driver is defined
    - inventory_hostname not in ["node3", "localhost"]
  block:
    - name: Install nic recover watchdog
      ansible.builtin.copy:
        src: recover-nic
        dest: /usr/local/sbin/recover-nic
        owner: root
        group: root
        mode: "0755"

    - name: Syntax-check recover-nic
      ansible.builtin.command: bash -n /usr/local/sbin/recover-nic
      changed_when: false

    - name: Install nic watchdog unit
      ansible.builtin.template:
        src: nic-watchdog.service.j2
        dest: /etc/systemd/system/nic-watchdog.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable nic watchdog
      ansible.builtin.systemd_service:
        name: nic-watchdog
        enabled: true
        daemon_reload: true

    - name: Check for nic driver module
      ansible.builtin.stat:
        path: "/sys/module/{{ nic_driver }}"
      register: nic_module

    - name: Start nic watchdog
      when: nic_module.stat.exists
      ansible.builtin.systemd_service:
        name: nic-watchdog
        state: started

- name: Disable X710 firmware LLDP
  when: nic_driver | default('') == "i40e"
  ansible.builtin.copy:
    src: 90-i40e-disable-fw-lldp.rules
    dest: /etc/udev/rules.d/90-i40e-disable-fw-lldp.rules
    owner: root
    group: root
    mode: "0644"

# CPU: conservative governor. Ramps under load, not pinned at turbo.
# Do not use throughput-performance (min_perf_pct=100).
- name: Install idle-ramp tuned profile
  when: inventory_hostname not in ["localhost"]
  block:
    - name: Create idle-ramp profile dir
      ansible.builtin.file:
        path: /etc/tuned/idle-ramp
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install idle-ramp tuned.conf
      ansible.builtin.copy:
        src: idle-ramp-tuned.conf
        dest: /etc/tuned/idle-ramp/tuned.conf
        owner: root
        group: root
        mode: "0644"

    - name: Enable tuned
      ansible.builtin.systemd_service:
        name: tuned
        enabled: true
        state: started

    - name: Query active tuned profile
      ansible.builtin.command: tuned-adm active
      register: tuned_active
      changed_when: false

    - name: Select idle-ramp tuned profile
      when: "'idle-ramp' not in tuned_active.stdout"
      ansible.builtin.command: tuned-adm profile idle-ramp

# Necessary for redis, which is used in our authentication app deployment.
# If you're standing up a non-redis cluster and won't be deploying any of the apps provided in the subfolders, you can skip this.
- name: Check status of thp
  ansible.builtin.command: cat /sys/kernel/mm/transparent_hugepage/enabled
  register: thp_status

- name: debug
  debug:
    msg: '{{ thp_status.stdout }}'

- name: Disable thp
  when: "'[never]' not in thp_status.stdout"
  block:
    - name: Disable until next reboot (preventing this block from running again)
      shell: echo never {{ ">" }} /sys/kernel/mm/transparent_hugepage/enabled

    - name: Disable THP defrag until next reboot
      shell: echo never {{ ">" }} /sys/kernel/mm/transparent_hugepage/defrag

    - name: Add to GRUB_CMDLINE_LINUX in /etc/default/grub
      shell: grubby --args="transparent_hugepage=never" --update-kernel=ALL

- name: Configure Kubernetes YUM Repo
  ansible.builtin.yum_repository:
    name: kubernetes
    description: "Kubernetes v{{ k8s_minor }} YUM Repo"
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/rpm/"
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/rpm/repodata/repomd.xml.key"
    gpgcheck: true

- name: Configure CRI-O YUM Repo
  ansible.builtin.yum_repository:
    name: cri-o
    description: "CRI-O YUM Repo"
    baseurl: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ k8s_minor }}/rpm/"
    gpgkey: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ k8s_minor }}/rpm/repodata/repomd.xml.key"
    gpgcheck: true

- name: Add Calico conf to Network Manager
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
    dest: /etc/NetworkManager/conf.d/calico.conf

- name: Update all packages
  ansible.builtin.dnf:
    state: latest
    name: "*"

- name: Install required packages
  ansible.builtin.dnf:
    state: latest
    name:
      - chrony
      - conntrack
      - container-selinux
      - ebtables
      - ethtool
      - git
      - iproute-tc
      - iptables
      - python3-pip
      - socat
      - sshpass
      - yum-utils
      - yum-plugin-versionlock

- name: Enable chrony
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: chronyd

- name: Check if Swap is enabled
  ansible.builtin.command: swapon -s
  register: swap_config

- name: Disable Swap, if enabled
  when: "'Size' in swap_config.stdout"
  block:
    - name: Disable temporarily
      ansible.builtin.command: swapoff -a

    - name: Remove from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: " swap "
        state: absent

- name: Disable SELINUX
  ansible.builtin.shell: |
    sed -i 's/^SELINUX=enforcing$/SELINUX=permissive/' /etc/selinux/config
    setenforce 0

- name: Configure Firewall
  ansible.posix.firewalld:
    state: enabled
    permanent: true
    immediate: true
    service: "{{ item }}"
  loop:
    - kube-apiserver
    - etcd-client
    - etcd-server
    - kubelet
    - kube-scheduler
    - kube-controller-manager
    - kube-nodeport-services
    - https

- name: Configure Firewall
  ansible.posix.firewalld:
    state: enabled
    permanent: true
    immediate: true
    port: "{{ item }}"
  loop:
    - "9000/tcp"
    - "5473/tcp"
    - "4789/udp"
    - "7946/tcp"
    - "7946/udp"
    - "8123/tcp"
    # hassio hostNetwork Govee LAN API listen port. Devices unicast
    # replies here; conntrack does not match them to the 4001 scan.
    - "4002/udp"
    # node_exporter. kube-prometheus-stack deploys the DaemonSet with
    # hostNetwork, so Prometheus scrapes the node address directly and this
    # has to be open. It wasn't, so every host metric silently failed with
    # "no route to host" from the day the stack was deployed — the exporters
    # were listening the whole time.
    - "9100/tcp"
