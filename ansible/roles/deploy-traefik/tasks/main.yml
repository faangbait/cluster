# kubectl create -n traefik secret generic aws-credentials --from-literal=AWS_REGION=us-east-1 --from-literal=AWS_ACCESS_KEY_ID=XXXXX --from-literal=AWS_SECRET_ACCESS_KEY=XXXXX

- name: Add Traefik Chart Repo
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://helm.traefik.io/traefik

- name: Deploy Traefik 41.2.0
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    release_namespace: traefik
    create_namespace: true
    chart_version: "41.2.0"
    values:
      deployment:
        replicas: 2
        imagePullSecrets:
          - name: regcred
        initContainers:
          - name: volume-permissions
            image: busybox:1.36.1
            command: ["sh", "-c", "touch /data/acme.json; chown 65532 /data/acme.json; chmod -v 600 /data/acme.json"]
            securityContext:
              runAsNonRoot: false
              runAsGroup: 0
              runAsUser: 0
            volumeMounts:
            - mountPath: /data
              name: certs

      volumes:
        - name: traefik-configmap
          mountPath: "/config"
          type: configMap

      log:
        level: WARN

      accessLog:
        enabled: true
        filePath: "/tmp/access.log"
        bufferingSize: 100

      global:
        checkNewVersion: true

      additionalArguments:
        - "--providers.file.directory=/config"
        # TODO: https://doc.traefik.io/traefik/providers/http/

      envFrom:
        - secretRef:
            name: aws-credentials

      # env:
      # - name: LEGO_DISABLE_CNAME_SUPPORT
      #   value: "true"

      providers:
        kubernetesCRD:
          allowCrossNamespace: true

      ports:
        metrics:
          port: 9999

        web:
          port: 8000
          expose:
            default: true
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https

        websecure:
          port: 8443
          expose:
            default: true
          http:
            # Authelia middleware is applied per-IngressRoute, not here - entrypoint-wide
            # application forced every request (including Authelia's own "bypass" domains)
            # through forwardAuth, making authelia a single point of failure for everything.
            # Add `middlewares: [{name: chain-authelia-auth, namespace: vault}]` on the
            # route block of any IngressRoute that needs one_factor/two_factor protection.
            tls:
              enabled: true
              certResolver: "letsencrypt"
              options: "default"

        dht-tcp:
          port: 54321
          expose:
            default: true
          protocol: TCP
          http:
            tls:
              enabled: true
              certResolver: "letsencrypt"
              options: ""

        dht-udp: # TODO: Put this on the same port as tcp
          port: 54322
          expose:
            default: true
          protocol: UDP

        minecraft:
          port: 25565
          expose:
            default: true
          protocol: TCP
          http:
            tls:
              enabled: true
              certResolver: "letsencrypt"

      tlsOptions:
        default:
          sniStrict: true
          preferServerCipherSuites: true
          curvePreferences:
            - CurveP521
            - CurveP384
          minVersion: VersionTLS12

      service:
        enabled: true
        type: LoadBalancer
        spec:
          loadBalancerIP: "10.4.0.2"

      persistence:
        enabled: true
        storageClass: "glass-cfg"
        accessMode: "ReadWriteMany"
        name: "certs"
        path: "/data"

      # CAVEAT: acme.json has no distributed locking - with replicas: 2 both pods share
      # this RWX file but concurrent ACME renewal from both at once can corrupt it. Low
      # risk here (single resolver, infrequent renewal), but if acme.json gets corrupted,
      # drop to replicas: 1 to force a clean re-issue, then scale back up.
      certificatesResolvers:
        letsencrypt:
          acme:
            email: root@madeof.glass
            dnsChallenge:
              provider: route53
              delayBeforeCheck: 60
              disablePropagationCheck: true
              resolvers:
                - 1.1.1.1
                - 46.227.67.134
                - 192.165.9.158
                - 8.8.8.8
                - 8.8.4.4
                - 9.9.9.9
            storage: /data/acme.json

      securityContext:
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true

      podSecurityContext:
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
