- name: Create MetalLB Namespace
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: metallb
    definition:
      metadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

- name: Add MetalLB Chart Repo
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: https://metallb.github.io/metallb

# 0.16.1 defaults to frr-k8s. Pin native FRR — that is the backend the gate ran.
# This rolls the speaker DaemonSet. Do not run until 10.0.15.x LBs are gone.
- name: Deploy MetalLB 0.16.1
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    release_namespace: metallb
    create_namespace: true
    chart_version: "0.16.1"
    values:
      speaker:
        frr:
          enabled: true
      frrk8s:
        enabled: false

- name: Deploy MetalLB BGP resources
  kubernetes.core.k8s:
    state: present
    apply: true
    src: "{{ playbook_dir }}/files/kubernetes/values/networking/metallb-resources.yaml"
