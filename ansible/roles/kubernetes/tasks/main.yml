- name: Install Kubernetes / CRI-O
  ansible.builtin.dnf:
    state: present
    name:
      - "cri-o-{{ k8s_patch }}"
      - "kubeadm-{{ k8s_patch }}"
      - "kubectl-{{ k8s_patch }}"
      - "kubelet-{{ k8s_patch }}"
    disable_excludes: "kubernetes,cri-o"

- name: Version Lock Critical Packages
  community.general.yum_versionlock:
    name:
      - cri-o
      - kubeadm
      - kubectl
      - kubelet

- name: Enable kubelet and crio
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: "{{ item }}"
  loop:
    - kubelet
    - crio

- name: Configure crio networking
  ansible.builtin.copy:
    content: |
      [crio.network]
      plugin_dirs = [
        "/opt/cni/bin",
        "/usr/libexec/cni",
      ]
    dest: /etc/crio/crio.conf.d/20-networking.conf

- name: Configure crio security
  ansible.builtin.copy:
    content: |
      [crio.runtime]
      selinux = false
      default_capabilities = [
        "NET_RAW",
        "CHOWN",
        "DAC_OVERRIDE",
        "FSETID",
        "FOWNER",
        "SETGID",
        "SETUID",
        "SETPCAP",
        "NET_BIND_SERVICE",
        "KILL",
      ]
    dest: /etc/crio/crio.conf.d/20-security.conf

- name: Configure crio metrics
  ansible.builtin.copy:
    content: |
      [crio.metrics]
      enable_metrics = true
      metrics_port = 9537
    dest: /etc/crio/crio.conf.d/60-metrics.conf

- name: Add Kube Local User
  ansible.builtin.user:
    name: kube
    comment: Kube Local
    uid: 1050
    groups:
      - wheel
    append: true

- name: Add Authorized Keys
  ansible.posix.authorized_key:
    user: kube
    key: "{{ lookup('file', 'public_keys/yubikey.pub') }}"
    exclusive: true

- name: Make ~/.kube/
  ansible.builtin.file:
    state: directory
    mode: '0755'
    path: "/home/kube/.kube"
    owner: kube

- name: Make ~/.kube/
  ansible.builtin.file:
    state: directory
    mode: '0755'
    path: "{{ localuser_home }}/.kube"
    owner: "{{ localuser_account }}"
