# Managed by Ansible (install-gluster role)
# nfs-ganesha fronts every cluster PVC (FSAL_GLUSTER exports /cfg and /bulk).
# It has SIGSEGV'd on gluster brick disconnects, and with no restart policy a
# single crash wedges every NFS mount cluster-wide. Keep restarting it.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=15s
