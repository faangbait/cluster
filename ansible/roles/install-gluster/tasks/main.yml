- name: Enable Extras repo
  community.general.dnf_config_manager:
    name: extras
    state: enabled

- name: Install centos SIGs
  ansible.builtin.dnf:
    state: present
    name:
      - centos-release-gluster11
      - centos-release-nfs-ganesha4

- name: Install gluster
  ansible.builtin.dnf:
    state: present
    name:
      - glusterfs
      - glusterfs-libs
      - glusterfs-server
      - glusterfs-client
      - nfs-ganesha-gluster
      - nfs-ganesha
    enablerepo:
      - devel
      - centos-nfs-ganesha-4

- name: Version Lock gluster
  community.general.yum_versionlock:
    name:
      - glusterfs
      - glusterfs-libs
      - glusterfs-server
      - nfs-ganesha-gluster
      - nfs-ganesha

- name: Add Ganesha conf
  ansible.builtin.copy:
    src: templates/ganesha.conf
    dest: /etc/ganesha/ganesha.conf
    mode: '0644'

- name: Ensure the nfs-ganesha systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-ganesha.service.d
    state: directory
    mode: '0755'
  tags:
    - ganesha-hardening

- name: Restart nfs-ganesha automatically on failure
  ansible.builtin.copy:
    src: templates/nfs-ganesha-restart.conf
    dest: /etc/systemd/system/nfs-ganesha.service.d/restart.conf
    mode: '0644'
  register: ganesha_restart_dropin
  tags:
    - ganesha-hardening

- name: Reload systemd after changing the nfs-ganesha unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ganesha_restart_dropin is changed
  tags:
    - ganesha-hardening

- name: Configure Firewall
  ansible.posix.firewalld:
    state: enabled
    permanent: true
    service: "{{ item }}"
    zone: "public"
  loop:
    - glusterfs
    - nfs

- name: Enable gluster
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: "{{ item }}"
  loop:
    - glusterd
    - nfs-ganesha

- name: Add client mount-points
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    attributes: +i
  loop:
    - /mnt/replicated
    - /mnt/bulk

- name: Add fstab entries
  ansible.builtin.blockinfile:
    path: /etc/fstab
    block: |
      localhost:/glass_cfg /mnt/replicated glusterfs defaults,_netdev,x-systemd.requires=glusterd.service,x-systemd.automount 0 0
      localhost:/glass_bulk /mnt/bulk glusterfs defaults,_netdev,x-systemd.requires=glusterd.service,x-systemd.automount 0 0
    backup: true

- name: Configure Thin Pool autoextend threshold
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: "^\\s*#?\\s*thin_pool_autoextend_threshold\\s*="
    line: "	thin_pool_autoextend_threshold = 70"
    firstmatch: true

# Autoextend adds this percent of the pool's *current* size each time. Keep
# it small: these pools are already carved out of most of their PV, so a
# large percentage (the LVM default is 20%) can easily exceed remaining VG
# free space and autoextend just fails forever (dmeventd retries and logs
# "Failed command" every 10-30s indefinitely).
- name: Configure Thin Pool autoextend percent
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: "^\\s*#?\\s*thin_pool_autoextend_percent\\s*="
    line: "	thin_pool_autoextend_percent = 1"
    firstmatch: true

- name: Configure existing bricks
  ansible.builtin.shell: |
    for brick in $(ls /dev/mapper/gluster*-brickvol); do
      brickno=$(basename ${brick} | sed -e "s/^gluster//" -e "s/-brickvol$//")
      brickpath=/data/glusterfs/glass${brickno}

      sudo mkdir -p ${brickpath}
      sudo chattr +i ${brickpath}

      # nofail + a longer device-timeout: thin pool activation runs thin_check
      # at boot, which can take tens of seconds on a large, heavily-allocated
      # pool and occasionally exceeds the default device timeout, dropping
      # the node into emergency mode. nofail means a slow/failed brick mount
      # no longer blocks the rest of boot.
      sudo echo "/dev/mapper/gluster${brickno}-brickvol /data/glusterfs/glass${brickno} xfs rw,inode64,noatime,nouuid,nofail,x-systemd.device-timeout=300 1 2" | tee -a /etc/fstab
    done

    sudo systemctl daemon-reload
  args:
    creates: /data/glusterfs

- name: Discover configured gluster brick mount points
  ansible.builtin.find:
    paths: /data/glusterfs
    file_type: directory
    patterns: "glass*"
  register: gluster_brick_dirs
  tags:
    - gluster-hardening

- name: Ensure the glusterd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/glusterd.service.d
    state: directory
    mode: '0755'
  tags:
    - gluster-hardening

# Closes a boot-time race: nofail + the long device-timeout above mean a
# brick mount can still be in progress when glusterd starts, so glusterd
# starts brickd against a path nothing is mounted on yet and that brick
# silently never comes up.
- name: Require brick mounts before glusterd starts
  ansible.builtin.template:
    src: templates/glusterd-brick-mounts.conf.j2
    dest: /etc/systemd/system/glusterd.service.d/brick-mounts.conf
    mode: '0644'
  register: glusterd_brick_mounts_dropin
  tags:
    - gluster-hardening

- name: Reload systemd after changing the glusterd unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: glusterd_brick_mounts_dropin is changed
  tags:
    - gluster-hardening
