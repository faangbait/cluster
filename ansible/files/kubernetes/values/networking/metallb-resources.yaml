# BGP is the advertisement path. No L2Advertisement, no NIC list.
# Do not apply while any Service still holds a 10.0.15.x LB IP.
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm-pro
  namespace: metallb
spec:
  myASN: 65001
  peerASN: 65000
  peerAddress: 10.0.0.1
  # Required: every node address carries noprefixroute (set by NetworkManager, not a
  # NIC property), so zebra's connected nexthop is inactive and single-hop eBGP will
  # not resolve 10.0.0.1.
  ebgpMultiHop: true
  # node4's bnx2x wedges with the link still up, so nothing tears the session down
  # early — the UDM keeps forwarding into a dead next-hop for the whole hold time.
  # Default is 90s. Hold time negotiates to the lower of the two ends, so setting it
  # here alone is enough; the UDM needs no matching change.
  #
  # BFD would detect in <1s, but the UDM's FRR has no bfdd — `show bfd peers` returns
  # "% Unknown command" — so timers are the only lever that works one-sided.
  holdTime: 9s
  keepaliveTime: 3s
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb
spec:
  addresses:
    - 10.4.0.0/22
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: bgp
  namespace: metallb
spec:
  ipAddressPools:
    - default
  aggregationLength: 32
