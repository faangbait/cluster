# BGP is the advertisement path. No L2Advertisement, no NIC list.
# Do not apply while any Service still holds a 10.0.15.x LB IP.
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm-pro
  namespace: metallb
spec:
  myASN: 65001
  peerASN: 65000
  peerAddress: 10.0.0.1
  # Required: every node address carries noprefixroute (set by NetworkManager, not a
  # NIC property), so zebra's connected nexthop is inactive and single-hop eBGP will
  # not resolve 10.0.0.1.
  ebgpMultiHop: true
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb
spec:
  addresses:
    - 10.4.0.0/22
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: bgp
  namespace: metallb
spec:
  ipAddressPools:
    - default
  aggregationLength: 32
