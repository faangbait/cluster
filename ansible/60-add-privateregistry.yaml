- name: Add Private Registry
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  tasks:
    - name: Look up the Traefik deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: traefik
        name: traefik
      register: add_privateregistry_traefik
      check_mode: false

    - name: Assert Traefik is deployed
      ansible.builtin.assert:
        that:
          - add_privateregistry_traefik.resources | length > 0
        fail_msg: >-
          Traefik is not deployed. This playbook applies Middlewares and an
          IngressRoute, which need the traefik.io CRDs the chart installs. Run:
            ansible-playbook -i inventory/hosts.yml 55-deploy-traefik.yaml
        quiet: true

    - name: Deploy Private Registry (PersistentVolumeClaim)
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: v1
        kind: PersistentVolumeClaim
        name: dockerregistry
        namespace: lab
        definition: |
          spec:
            storageClassName: "glass-bulk"
            accessModes:
              - ReadWriteMany
            resources:
              requests:
                storage: 200Gi

    - name: Deploy Private Registry (Deployment)
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: apps/v1
        kind: Deployment
        name: dockerregistry
        namespace: lab
        definition: |
          metadata:
            labels:
              app.kubernetes.io/name: dockerregistry
              app.kubernetes.io/part-of: registry
              app.kubernetes.io/release: stable
            annotations:
              a8r.io/description: "Internal docker registry"
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/cluster"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: registry-server
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: registry-server
                  app.kubernetes.io/part-of: registry
              spec:
                imagePullSecrets:
                  - name: regcred
                containers:
                - name: registry-server
                  image: registry:2
                  env:
                  - name: REGISTRY_STORAGE_DELETE_ENABLED
                    value: "true"
                  - name: REGISTRY_AUTH
                    value: "htpasswd"
                  - name: REGISTRY_AUTH_HTPASSWD_REALM
                    value: "Registry Realm"
                  - name: REGISTRY_AUTH_HTPASSWD_PATH
                    value: "/auth/htpasswd"
                  volumeMounts:
                  - mountPath: /var/lib/registry
                    name: bulk-registry
                  - mountPath: /auth
                    name: htpasswd
                    readOnly: true
                  resources:
                    limits:
                      memory: 128Mi
                      cpu: ".5"
                volumes:
                  - name: bulk-registry
                    persistentVolumeClaim:
                      claimName: dockerregistry
                  - name: htpasswd
                    secret:
                      secretName: registry-htpasswd
                      items:
                      - key: pass
                        path: htpasswd

    - name: Deploy Private Registry (Service)
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: v1
        kind: Service
        name: registry-service
        namespace: lab
        definition: |
          metadata:
            labels:
              app.kubernetes.io/name: registry-service
              app.kubernetes.io/part-of: registry
          spec:
            selector:
              app.kubernetes.io/name: registry-server
            ports:
              - port: 5000
                name: registry-tcp

    - name: Deploy Private Registry (IngressRoute)
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: traefik.io/v1alpha1
        kind: IngressRoute
        name: registry-ingress
        namespace: lab
        definition: |
          metadata:
            labels:
              app.kubernetes.io/name: registry-ingress
              app.kubernetes.io/part-of: registry
            annotations:
              external-dns.internal/target: 10.4.0.2
              external-dns.public/publish: "true"
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(`registry.lab.madeof.glass`)
                kind: Rule
                services:
                  - name: registry-service
                    port: registry-tcp
                middlewares:
                  - name: registry-cors
                    namespace: lab
            tls:
              certResolver: letsencrypt

    - name: Deploy Private Registry (Middleware)
      kubernetes.core.k8s:
        state: present
        apply: true
        api_version: traefik.io/v1alpha1
        kind: Middleware
        name: registry-cors
        namespace: lab
        definition: |
          spec:
            headers:
              accessControlAllowMethods:
                - GET
                - OPTIONS
                - PUT
                - POST
                - DELETE
              accessControlAllowOriginList:
                - https://registry.lab.madeof.glass
              accessControlAllowCredentials: true
              accessControlMaxAge: 100
              addVaryHeader: true
