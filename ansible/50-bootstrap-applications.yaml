- name: Bootstrap Kubernetes Applications
  hosts: controlplane
  become: false
  any_errors_fatal: true
  tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        calico_version: v3.31.2

    - name: Ensure the kubernetes python package is installed on node1
      ansible.builtin.pip:
        name: kubernetes
        state: present
      delegate_to: node1
      
    - name: Deploy Calico
      ansible.builtin.import_role:
        name: deploy-calico

