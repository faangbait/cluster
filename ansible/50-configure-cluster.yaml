- name: Configure Cluster
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  tasks:
    - name: Add Calico Chart Repo
      kubernetes.core.helm_repository:
        name: projectcalico
        repo_url: https://docs.tigera.io/calico/charts
        # helm 4 errors on an existing repo instead of no-opping.
        force_update: true

    - name: Deploy Calico v3.31.2
      kubernetes.core.helm:
        name: calico
        chart_ref: projectcalico/tigera-operator
        release_namespace: tigera-operator
        create_namespace: true
        chart_version: "v3.31.2"
        values:
          installation:
            cni:
              type: Calico
            calicoNetwork:
              kubeProxyManagement: Enabled
              linuxDataplane: BPF
              bgp: Disabled
              ipPools:
                - name: default-ipv4-ippool
                  blockSize: 26
                  cidr: 10.48.0.0/16
                  encapsulation: VXLANCrossSubnet
                  natOutgoing: Enabled
                  nodeSelector: all()
              nodeAddressAutodetectionV4:
                cidrs:
                  - "10.0.8.0/24"
          defaultFelixConfiguration:
            enabled: true
            bpfExternalServiceMode: Tunnel
          kubernetesServiceEndpoint:
            host: "10.0.8.254"
            port: "6443"

    # Required whenever linuxDataplane: BPF is enabled - IPAM must be node-affine
    # or the eBPF/DSR forwarding path can send return traffic to the wrong node,
    # breaking direct node-to-node traffic (e.g. MetalLB memberlist on 7946).
    # https://docs.tigera.io/calico/latest/networking/ipam/ipam#change-the-node-selector-for-an-ip-pool
    - name: Enable strict affinity for Calico IPAM (required for eBPF dataplane)
      kubernetes.core.k8s:
        state: present
        api_version: projectcalico.org/v3
        kind: IPAMConfiguration
        name: default
        definition:
          spec:
            strictAffinity: true

    - name: Verify networking
      ansible.builtin.import_role:
        name: verify-networking

    - name: Label Nodes
      ansible.builtin.shell: |
        kubectl label nodes --overwrite node1 highmem=true
        kubectl label nodes --overwrite node4 highmem=true

    # The namespaces we deploy applications into, plus the two things every one of
    # them needs: an image-pull secret and the linuxserver.io PUID/PGID/TZ config.
    - name: Set the application namespaces
      ansible.builtin.set_fact:
        cluster_namespaces:
          - name: default
            description: "Cluster default. Hand-run workloads land here."
          - name: lab
            description: "Contains all the moving parts of a CI/CD pipeline, plus a sandbox environment for app deployment."
          - name: vault
            description: "High-security environment; private access."
          - name: home
            description: "Workloads related to the real world."
          - name: news
            description: "Reads and posts to usenet, sorts content."
          - name: public
            description: "Public-facing applications and services."
          - name: observability
            description: "Monitoring and observability components."
            repository: "https://github.com/faangbait/k8s-observability"

    - name: Create the application namespaces
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item.name }}"
            labels:
              app.kubernetes.io/part-of: "{{ item.name }}"
            annotations:
              a8r.io/description: "{{ item.description }}"
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "{{ item.repository | default('https://github.com/faangbait/antennae') }}"
      loop: "{{ cluster_namespaces }}"
      loop_control:
        label: "{{ item.name }}"

    # regcred is never created here, only checked. The DockerHub credentials exist
    # only in the live cluster - there is no copy in this repo - and
    # `state: present` on a Secret is a full replace, so writing one would put every
    # namespace that pulls a private image into ImagePullBackOff with no way back.
    - name: Look up the regcred pull secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ item.name }}"
        name: regcred
      loop: "{{ cluster_namespaces }}"
      loop_control:
        label: "{{ item.name }}"
      register: configure_cluster_regcred
      # The assert below consumes this, so it must run under --check too.
      check_mode: false

    - name: Assert regcred exists in every application namespace
      ansible.builtin.assert:
        that:
          - item.resources | length > 0
          - item.resources[0].type == 'kubernetes.io/dockerconfigjson'
        fail_msg: >-
          Secret regcred is missing in namespace {{ item.item.name }}. Create it out
          of band, then re-run:
            kubectl -n {{ item.item.name }} create secret docker-registry regcred \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username=... --docker-password=... --docker-email=...
          Read an existing one back rather than guessing - they are the only copy:
            kubectl -n default get secret regcred \
              -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d
        quiet: true
      loop: "{{ configure_cluster_regcred.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ConfigMaps are namespaced and cannot be shared, so this is repeated per
    # namespace rather than templated.
    - name: Create the universal lsio-conf ConfigMap
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: lsio-conf
            namespace: "{{ item.name }}"
            labels:
              app.kubernetes.io/name: lsio-conf
              app.kubernetes.io/part-of: core
            annotations:
              a8r.io/description: "Configures containers provided by linuxserver.io"
              a8r.io/owner: "@faangbait"
              a8r.io/repository: "https://github.com/faangbait/antennae"
          data:
            PUID: "1000"
            PGID: "1000"
            TZ: "America/Chicago"
      loop: "{{ cluster_namespaces }}"
      loop_control:
        label: "{{ item.name }}"

    # The two provisioners behind every PVC: glass-bulk (media, /bulk) and glass-cfg
    # (application config, /cfg, and the default StorageClass). release_namespace is
    # vault with no create_namespace, so this must run after the namespaces above.

    - name: Add NFS Subdir External Provisioner Chart Repo
      kubernetes.core.helm_repository:
        name: nfs-subdir-external-provisioner
        repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        # helm 4 errors on an existing repo instead of no-opping.
        force_update: true

    # Pinned to what the live releases run. Unpinned, any run of this playbook would
    # silently upgrade the provisioner behind every PVC. Bump deliberately.
    - name: Deploy glass-bulk-provisioner 4.0.18
      kubernetes.core.helm:
        name: glass-bulk-provisioner
        chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
        chart_version: "4.0.18"
        release_namespace: vault
        values:
          nfs:
            server: '10.0.8.254'
            path: '/bulk'
          storageClass:
            name: glass-bulk
            provisionerName: k8s-sigs.io/glass-bulk-provisioner
            archiveOnDelete: false
            accessModes: ReadWriteMany
            pathPattern: pvc/${.PVC.namespace}/${.PVC.name}

    - name: Deploy glass-cfg-provisioner 4.0.18
      kubernetes.core.helm:
        name: glass-cfg-provisioner
        chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
        chart_version: "4.0.18"
        release_namespace: vault
        values:
          nfs:
            server: '10.0.8.254'
            path: '/cfg'
          storageClass:
            name: glass-cfg
            provisionerName: k8s-sigs.io/glass-cfg-provisioner
            defaultClass: true
            accessModes: ReadWriteMany
            pathPattern: pvc/${.PVC.namespace}/${.PVC.name}
